<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Overlay</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    .hero-banner {
      padding: 40px 24px;
      max-width: 600px;
      color: #64748b;
    }
    .hero-banner h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .hero-banner p {
      font-size: 13.5px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="hero-banner">
    <h1>Minimalist To-Do List Overlay</h1>
    <p>Widget To-Do List Anda melayang di pojok kanan atas layar dengan penyimpanan data lokal <strong>IndexedDB</strong> dan pemilih tanggal <strong>Shadcn/UI Date Picker</strong>.</p>
  </div>

  <script src="db.js"></script>
  <script src="content_script.js"></script>
</body>
</html>
